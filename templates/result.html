<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard des résultats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        .good { background-color: #b6fcb6; }
        .mid { background-color: #fff3b6; }
        .bad { background-color: #ffb6b6; }
    </style>
</head>
<body>

<h2>Moyenne générale de la classe : {{ moyenne_classe | round(2) }}</h2>

---

#  Tableau des étudiants

<table>
    <tr>
        <th>Rang</th>
        <th>Nom</th>
        <th>Moyenne</th>
    </tr>

    {% for e in etudiants %}
    <tr class="
        {% if e.moyenne >= 12 %}good
        {% elif e.moyenne >= 8 %}mid
        {% else %}bad
        {% endif %}
    ">
        <td>{{ loop.index }}</td>
        <td>{{ e.nom }}</td>
        <td>{{ e.moyenne | round(2) }}</td>
    </tr>
    {% endfor %}
</table>

---

#  Graphique des moyennes

<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
        labels: {{ noms|tojson }},
        datasets: [{
            label: 'Moyenne',
            data: {{ moyennes|tojson }}
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true, max: 20 }
        }
    }
});
</script>

---

#  Histogramme

<canvas id="hist"></canvas>

<script>
const notes = {{ notes|tojson }};

function count(min, max) {
    return notes.filter(n => n >= min && n < max).length;
}

new Chart(document.getElementById('hist'), {
    type: 'bar',
    data: {
        labels: ['0-5','5-10','10-15','15-20'],
        datasets: [{
            label: 'Effectif',
            data: [
                count(0,5),
                count(5,10),
                count(10,15),
                count(15,20)
            ]
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true }
        }
    }
});
</script>

</body>
</html>
